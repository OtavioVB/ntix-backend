# PgAdmin: https://database.ntix.com.br, encaminhado para o contêiner, publicado só em 127.0.0.1.
# Só os IPs do secret VPS_PGADMIN_ALLOWED_IPS chegam ao login; os demais recebem 403.
upstream ntix_pgadmin {
    server 127.0.0.1:5050;
    keepalive 8;
}

# O PgAdmin usa WebSocket (socket.io) na Query Tool e no PSQL Tool.
map $http_upgrade $ntix_pgadmin_connection {
    default upgrade;
    ''      "";
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name database.ntix.com.br;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Lista de IPs gerada pelo deploy fora de conf.d (devops/vps/apply-gateway.sh), com 'deny all' no final.
    # O próprio servidor é liberado para a verificação do deploy.
    allow 127.0.0.1;
    allow ::1;
    include /etc/nginx/ntix/database-allowed-ips.conf;

    # Importação de arquivos e backups pequenos pela tela.
    client_max_body_size 50m;

    # Rate limiting (rate-limit.conf): o burst maior absorve os assets e as consultas periódicas da tela do PgAdmin.
    limit_req zone=ntix_per_ip burst=50 nodelay;

    location / {
        proxy_pass http://ntix_pgadmin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ntix_pgadmin_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        # Consultas longas na Query Tool.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
