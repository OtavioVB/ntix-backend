# Frontend (web/): arquivos estáticos do build do Vite publicados por devops/vps/deploy-web.sh.
# O mesmo build atende dois endereços: o app escolhe as rotas pelo nome (web/src/producer/paths.ts).

# https://ntix.com.br: hub do público.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ntix.com.br;

    root /var/www/ntix-web;
    index index.html;

    # Rate limiting (rate-limit.conf): o burst absorve o carregamento dos assets sem passar de 10 por segundo na média.
    limit_req zone=ntix_per_ip burst=10 nodelay;

    # A área do produtor mudou para o subdomínio: endereços antigos redirecionam para o equivalente lá.
    location = /produtores {
        return 301 https://produtores.ntix.com.br/;
    }

    location = /entrar {
        return 301 https://produtores.ntix.com.br/entrar;
    }

    location = /painel {
        return 301 https://produtores.ntix.com.br/visao-geral;
    }

    location ^~ /painel/ {
        rewrite ^/painel/(.*)$ https://produtores.ntix.com.br/$1 permanent;
    }

    # Arquivos com hash no nome: podem ficar em cache por tempo indeterminado.
    # HSTS repetido em cada location: um add_header na location descarta os herdados do server.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # SPA com react-router: rotas desconhecidas devolvem o index.html, que nunca fica em cache.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}

# https://produtores.ntix.com.br: cadastro na raiz, login em /entrar e o painel nos demais caminhos.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name produtores.ntix.com.br;

    root /var/www/ntix-web;
    index index.html;

    limit_req zone=ntix_per_ip burst=10 nodelay;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}

# www.ntix.com.br: endereço alternativo, redirecionado para o domínio principal.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ntix.com.br;

    return 301 https://ntix.com.br$request_uri;
}
