# Frontend (web/): arquivos estáticos do build do Vite, publicados por devops/vps/deploy-web.sh.
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    root /var/www/ntix-web;
    index index.html;

    # Arquivos com hash no nome: podem ficar em cache por tempo indeterminado.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA com react-router: rotas desconhecidas devolvem o index.html, que nunca fica em cache.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
