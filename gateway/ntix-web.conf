# Frontend (web/): arquivos estáticos do build do Vite, publicados por devops/vps/deploy-web.sh.
server {
    # HTTPS com o certificado de tls.conf. Uma chamada em HTTP puro nesta porta é redirecionada para HTTPS.
    listen 8081 ssl http2;
    listen [::]:8081 ssl http2;
    server_name _;
    error_page 497 =308 https://$host:$server_port$request_uri;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/ntix-web;
    index index.html;

    # Rate limiting (rate-limit.conf): o burst absorve o carregamento dos assets sem passar de 10 por segundo na média.
    limit_req zone=ntix_per_ip burst=10 nodelay;

    # Arquivos com hash no nome: podem ficar em cache por tempo indeterminado.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA com react-router: rotas desconhecidas devolvem o index.html, que nunca fica em cache.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
