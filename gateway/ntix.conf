# Gateway público da API: recebe na porta 8080 e encaminha para o contêiner, publicado só em 127.0.0.1.
upstream ntix_webapi {
    server 127.0.0.1:5080;
    keepalive 32;
}

server {
    # HTTPS com o certificado de tls.conf. Uma chamada em HTTP puro nesta porta é redirecionada para HTTPS.
    listen 8080 ssl http2;
    listen [::]:8080 ssl http2;
    server_name _;
    error_page 497 =308 https://$host:$server_port$request_uri;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    # Rate limiting (rate-limit.conf): o burst absorve rajadas curtas sem passar de 10 por segundo na média.
    limit_req zone=ntix_per_ip burst=10 nodelay;

    location / {
        proxy_pass http://ntix_webapi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
