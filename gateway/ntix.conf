# API: https://api.ntix.com.br, encaminhada para o contêiner, publicado só em 127.0.0.1.
upstream ntix_webapi {
    server 127.0.0.1:5080;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ntix.com.br;

    # HSTS: depois do primeiro acesso, o navegador só fala HTTPS com este nome por um ano.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;

    # Rate limiting (rate-limit.conf): o burst absorve rajadas curtas sem passar de 10 por segundo na média.
    limit_req zone=ntix_per_ip burst=10 nodelay;

    location / {
        proxy_pass http://ntix_webapi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
