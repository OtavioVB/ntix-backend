# Firewall do gateway: no máximo 10 requisições por segundo por IP de origem, somando API (8080) e frontend (8081).
# Cada server aplica com limit_req. 10 MB de zona guardam cerca de 160 mil IPs.
limit_req_zone $binary_remote_addr zone=ntix_per_ip:10m rate=10r/s;
limit_req_status 429;
limit_req_log_level warn;
