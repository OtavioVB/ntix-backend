# HTTPS do gateway: um certificado Let's Encrypt para ntix.com.br, www, api e produtores, válido por 90 dias.
# O certbot renova sozinho pelo timer do snap e recarrega o nginx. Emissão inicial em devops/vps/apply-gateway.sh.
ssl_certificate /etc/letsencrypt/live/ntix.com.br/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/ntix.com.br/privkey.pem;

# ssl_prefer_server_ciphers já vem no nginx.conf do pacote: redefinir aqui é erro. ssl_protocols também vem lá,
# com TLS 1.0 e 1.1, então apply-gateway.sh restringe a diretiva do pacote a TLS 1.2 e 1.3.
ssl_session_cache shared:ntix_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
