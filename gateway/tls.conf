# HTTPS do gateway: certificado Let's Encrypt emitido para o IP público, válido por cerca de 6 dias (perfil shortlived).
# O certbot renova sozinho pelo timer do snap e recarrega o nginx. Emissão inicial em devops/vps/apply-gateway.sh.
# ssl_protocols e ssl_prefer_server_ciphers já vêm no nginx.conf do pacote: redefinir aqui é erro. Os protocolos
# ficam restritos a TLS 1.2 e 1.3 em cada server.
ssl_certificate /etc/letsencrypt/live/ntix/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/ntix/privkey.pem;

ssl_session_cache shared:ntix_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
