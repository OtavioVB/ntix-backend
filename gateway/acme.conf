# Porta 80: atende o desafio HTTP-01 do Let's Encrypt (emissão e renovações) e redireciona o resto para HTTPS.
# Não depende do certificado: é o único arquivo aplicado enquanto o certificado é emitido pela primeira vez.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
