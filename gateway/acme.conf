# Porta 80: existe só para o Let's Encrypt validar o IP (desafio HTTP-01) na emissão e em cada renovação.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 404;
    }
}
