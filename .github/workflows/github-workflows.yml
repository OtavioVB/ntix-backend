name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  BUILD_CONFIGURATION: Release

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Compilar a solução
        run: dotnet build ntix.slnx --configuration ${{ env.BUILD_CONFIGURATION }}

  unit-tests:
    name: Testes unitários
    needs: build
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Rodar testes unitários
        run: dotnet test tsts/UnitTests/UnitTests.csproj --configuration ${{ env.BUILD_CONFIGURATION }}

  integrated-tests:
    name: Testes integrados
    needs: build
    runs-on: ubuntu-latest
    environment: Staging
    services:
      postgresql:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: ntix
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ntix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username ntix --dbname ntix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PostgreSqlConfiguration__ConnectionString: Host=localhost;Port=5432;Database=ntix;Username=ntix;Password=${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Rodar testes integrados
        run: dotnet test tsts/IntegratedTests/IntegratedTests.csproj --configuration ${{ env.BUILD_CONFIGURATION }}

  static-analysis:
    name: Análise estática
    needs: [unit-tests, integrated-tests]
    uses: ./.github/workflows/static-analysis.yml
    secrets:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  functional-tests:
    name: Testes funcionais
    needs: static-analysis
    runs-on: ubuntu-latest
    environment: Staging
    services:
      postgresql:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: ntix
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ntix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username ntix --dbname ntix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PostgreSqlConfiguration__ConnectionString: Host=localhost;Port=5432;Database=ntix;Username=ntix;Password=${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Rodar testes funcionais
        run: dotnet test tsts/FunctionalTests/FunctionalTests.csproj --configuration ${{ env.BUILD_CONFIGURATION }}

  deploy:
    name: Implantar na VPS
    needs: functional-tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: Production
    concurrency: deploy-vps
    env:
      WEBAPI_IMAGE: ntix-webapi:${{ github.sha }}
      DEPLOY_PATH: ntix
    steps:
      - uses: actions/checkout@v7

      - name: Configurar acesso SSH
        uses: ./.github/actions/setup-vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || '22' }}
          user: ${{ secrets.VPS_USER }}
          private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Verificar e instalar as dependências do servidor
        run: |
          ssh vps 'bash -s' < devops/vps/ensure-dependencies.sh
          ssh vps 'docker version --format "Docker {{.Server.Version}}" && docker compose version'

      - name: Detectar a arquitetura do servidor
        run: |
          architecture="$(ssh vps 'uname -m')"

          case "$architecture" in
            x86_64) platform="linux/amd64" ;;
            aarch64 | arm64) platform="linux/arm64" ;;
            *) echo "::error::Arquitetura do servidor não suportada: $architecture"; exit 1 ;;
          esac

          echo "VPS_PLATFORM=$platform" >> "$GITHUB_ENV"

      - name: Construir a imagem da API
        run: docker buildx build --platform "$VPS_PLATFORM" --file src/WebApi/Dockerfile --tag "$WEBAPI_IMAGE" --load .

      - name: Enviar a imagem para o servidor
        run: docker save "$WEBAPI_IMAGE" | gzip | ssh vps 'gunzip | docker load'

      - name: Enviar a configuração dos serviços
        # Substitui as pastas por inteiro: arquivos removidos do repositório não podem continuar no servidor.
        run: tar czf - devops data gateway | ssh vps "mkdir -p '$DEPLOY_PATH' && rm -rf '$DEPLOY_PATH/devops' '$DEPLOY_PATH/data' '$DEPLOY_PATH/gateway' && tar xzf - -C '$DEPLOY_PATH'"

      - name: Gerar as variáveis de ambiente no servidor
        env:
          POSTGRES_PASSWORD: ${{ secrets.VPS_POSTGRES_PASSWORD }}
          PASSWORD_PRIVATE_KEY: ${{ secrets.VPS_PASSWORD_PRIVATE_KEY }}
        run: |
          printf "POSTGRES_PASSWORD='%s'\nPASSWORD_PRIVATE_KEY='%s'\nWEBAPI_IMAGE=%s\nASPNETCORE_ENVIRONMENT=Production\nWEBAPI_PORT_BINDING=127.0.0.1:5080\n" \
            "$POSTGRES_PASSWORD" "$PASSWORD_PRIVATE_KEY" "$WEBAPI_IMAGE" \
            | ssh vps "umask 077 && cat > '$DEPLOY_PATH/devops/.env'"

      - name: Subir os serviços
        run: ssh vps "cd '$DEPLOY_PATH' && docker compose -f devops/docker-compose.yml --profile app up -d --remove-orphans"

      - name: Aplicar a configuração do gateway
        run: ssh vps "bash '$DEPLOY_PATH/devops/vps/apply-gateway.sh' '$DEPLOY_PATH/gateway'"

      - name: Verificar a API
        # Chama pelo domínio, conectando em 127.0.0.1: valida o certificado sem depender de hairpin NAT.
        run: |
          ssh vps "for attempt in \$(seq 1 30); do
            curl --fail --silent --output /dev/null --connect-to 'api.ntix.com.br:443:127.0.0.1:443' 'https://api.ntix.com.br/openapi/v1.json' && exit 0
            sleep 5
          done
          docker logs --tail 50 ntix-webapi
          exit 1"

      - name: Remover imagens antigas da API
        run: |
          ssh vps "docker image ls ntix-webapi --format '{{.Repository}}:{{.Tag}}' | grep -v '$WEBAPI_IMAGE' | xargs -r docker image rm || true"

  deploy-web:
    name: Implantar o frontend na VPS
    # Roda em paralelo com o deploy da API: os scripts da VPS se serializam onde disputam recursos.
    needs: functional-tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: Production
    concurrency: deploy-vps-web
    env:
      DEPLOY_PATH: ntix-web
    steps:
      - uses: actions/checkout@v7

      - name: Configurar acesso SSH
        uses: ./.github/actions/setup-vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || '22' }}
          user: ${{ secrets.VPS_USER }}
          private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Verificar e instalar as dependências do servidor
        run: |
          ssh vps 'bash -s' < devops/vps/ensure-dependencies.sh
          ssh vps 'echo "Node $(node --version), npm $(npm --version)"'

      - name: Enviar o frontend e a configuração do gateway
        # Substitui as pastas por inteiro: arquivos removidos do repositório não podem continuar no servidor.
        run: tar czf - web devops/vps gateway | ssh vps "mkdir -p '$DEPLOY_PATH' && rm -rf '$DEPLOY_PATH/web' '$DEPLOY_PATH/devops' '$DEPLOY_PATH/gateway' && tar xzf - -C '$DEPLOY_PATH'"

      - name: Instalar as dependências, gerar o build e publicar
        run: ssh vps "bash '$DEPLOY_PATH/devops/vps/deploy-web.sh' '$DEPLOY_PATH/web'"

      - name: Aplicar a configuração do gateway
        run: ssh vps "bash '$DEPLOY_PATH/devops/vps/apply-gateway.sh' '$DEPLOY_PATH/gateway'"

      - name: Verificar o frontend
        run: |
          for host in ntix.com.br produtores.ntix.com.br; do
            ssh vps "curl --fail --silent --output /dev/null --connect-to '$host:443:127.0.0.1:443' 'https://$host/'"
          done
